name: mobile_auto_drive
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  carousel_slider: 4.2.1
  stacked: 3.4.1+1
  firebase_storage: ^11.0.4
  firebase_messaging: ^14.4.0
  firebase_core: ^2.24.2
  cloud_firestore: ^4.0.4
  shared_preferences: ^2.0.13
  #flutter_paystack_max: 1.0.1
  flutter_svg: ^2.0.7
  flutter_paystack_max:
     path: ../mobile_auto_drive/flutter_paystack_max
  http: ^1.2.0
  image_picker: 1.0.7
  image_cropper: 5.0.0
  app_links: 4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  intl: ^0.17.0
  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/auto/
    - assets/images/icons/
    - assets/images/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat_regular.ttf
        - asset: assets/fonts/montserrat_bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat_black.ttf
          weight: 900
        - asset: assets/fonts/montserrat_thin.ttf
          weight: 100
        - asset: assets/fonts/montserrat_regular.ttf
          weight: 500